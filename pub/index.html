<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="持仓助手">
<meta name="theme-color" content="#000000">
<title>持仓助手 · VOO / 伯克希尔B / AAPL / 拼多多</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23000'/%3E%3Cpath d='M32 118 L62 84 L92 100 L128 52' stroke='%231d9bf0' stroke-width='12' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='128' cy='52' r='11' fill='%231d9bf0'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#000;
  --surface:#0a0a0a;
  --surface2:#16181c;
  --line:#2f3336;
  --line2:#232629;
  --text:#e7e9ea;
  --dim:#71767b;
  --dim2:#8b98a5;
  --accent:#1d9bf0;
  --accent-hover:#1a8cd8;
  --up:#f4212e;
  --down:#00ba7c;
  --radius:16px;
  --radius-sm:11px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg)}
body{
  color:var(--text);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  max-width:640px;margin:0 auto;
  padding-bottom:calc(env(safe-area-inset-bottom) + 28px);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0;font-weight:700}
h2{font-size:17px}

.topbar{
  position:sticky;top:0;z-index:30;
  background:rgba(0,0,0,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 0;
}
.topbar .titlerow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar h1{font-size:19px;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
.verified{width:17px;height:17px;flex:0 0 auto;fill:var(--accent)}
.marketline{color:var(--dim);font-size:12.5px;margin-top:3px;padding-bottom:9px;display:flex;align-items:center;gap:8px;min-width:0}
#marketline{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#storebadge{flex:0 0 auto}
.iconbtn{flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--text);
  border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer}
.iconbtn:active{background:var(--surface2)}

.tabs{display:flex;position:sticky;top:calc(env(safe-area-inset-top) + 62px);z-index:25;
  background:rgba(0,0,0,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line)}
.tab{flex:1;background:none;border:0;color:var(--dim);font:inherit;font-weight:600;font-size:14.5px;
  padding:14px 6px;cursor:pointer;position:relative}
.tab.on{color:var(--text);font-weight:700}
.tab.on::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:0;
  width:56px;height:3.5px;border-radius:999px;background:var(--accent)}
.tab:active{background:var(--surface2)}

.view{display:none}
.view.on{display:block}
.section{padding:16px}
.block{border-bottom:1px solid var(--line);padding:16px}
.block-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.sub{color:var(--dim);font-size:12.5px;line-height:1.4}
.faint{color:var(--dim);font-size:12px}
.dim{color:var(--dim2)}
.mono,.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--dim2)}
.hide{display:none!important}
.errbar{background:#2d1114;border-bottom:1px solid #5c1d22;color:#ff9aa2;font-size:13px;padding:11px 16px;display:none}
.errbar.on{display:block}

.quotes{border-bottom:1px solid var(--line)}
.qrow{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line2)}
.qrow:last-child{border-bottom:0}
.qavatar{width:38px;height:38px;border-radius:999px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;color:#fff;letter-spacing:-.02em}
.qmain{flex:1;min-width:0}
.qname{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:6px}
.qname .code{color:var(--dim);font-weight:400;font-size:12.5px}
.qmeta{color:var(--dim);font-size:12px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qprice{text-align:right;flex:0 0 auto}
.qprice b{font-size:16.5px;font-weight:700;display:block}
.qprice small{font-size:12.5px;font-variant-numeric:tabular-nums}
.badge{font-size:10.5px;line-height:1;padding:3px 6px;border-radius:999px;background:#1e3a52;color:#8ecdf8;white-space:nowrap}
.badge.warn{background:#3d2f10;color:#e2b53e}
.badge.alt{background:#2a2440;color:#c4a6ff}

.big{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.bignum{padding:13px 14px;background:var(--surface)}
.bignum:nth-child(odd){border-right:1px solid var(--line)}
.bignum:nth-child(-n+2){border-bottom:1px solid var(--line)}
.bignum>span{display:block;font-size:11.5px;color:var(--dim);font-weight:500}
.bignum>b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums}
.bignum>em{font-style:normal;font-size:12px;font-variant-numeric:tabular-nums}

.donutwrap{display:flex;gap:18px;align-items:center}
.donut{width:108px;height:108px;border-radius:50%;position:relative;flex:0 0 auto;background:conic-gradient(#2f3336 0 100%)}
.donut::after{content:"";position:absolute;inset:20px;border-radius:50%;background:var(--bg)}
.donut .inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1}
.donut .inner b{font-size:15px;font-weight:800}
.donut .inner span{font-size:10px;color:var(--dim)}
.legend{flex:1;min-width:0}
.legend .li{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line2)}
.legend .li:first-child{padding-top:0}
.legend .li:last-child{border-bottom:0;padding-bottom:0}
.dot{width:10px;height:10px;border-radius:999px;flex:0 0 auto}
.legend .li .nm{flex:1;min-width:0;line-height:1.3;overflow:hidden}
.legend .li .nm b{display:block;font-weight:700;font-size:14px}
.legend .li .nm small{display:block;color:var(--dim);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend .li .vl{flex:0 0 auto;text-align:right;line-height:1.25;white-space:nowrap}
.legend .li .vl b{display:block;font-size:15.5px;font-weight:800;letter-spacing:-.01em}
.legend .li .vl small{display:block;color:var(--dim);font-size:11.5px;margin-top:1px}

button{font:inherit;cursor:pointer;border:0;color:var(--text);background:var(--surface2)}
button:active{transform:scale(.985)}
.btn{background:var(--accent);color:#fff;font-weight:700;font-size:14.5px;border-radius:999px;padding:10px 18px}
.btn:hover{background:var(--accent-hover)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:600;
  border-radius:999px;padding:9px 15px;font-size:13.5px}
.btn-ghost:hover{background:var(--surface2)}
.btn-ghost:disabled{opacity:.45;cursor:not-allowed}
.btn-small{border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn-row.center{justify-content:center}

input[type=number],input[type=text]{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--text);
  font-size:16px;padding:10px 11px;font-variant-numeric:tabular-nums;text-align:right;min-width:0}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pctinput{width:64px;text-align:right;font-weight:700}
.pctinput::-webkit-outer-spin-button,.pctinput::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.pctinput{-moz-appearance:textfield}
.posinput{width:104px}
.field{display:flex;align-items:center;gap:8px}
.field>label{color:var(--dim);font-size:13px;white-space:nowrap}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.costlist{display:flex;flex-direction:column}
.costcard{border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;margin-bottom:10px;background:var(--surface)}
.costcard .capline{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line2)}
.costcard .capline .sym{font-size:15px;font-weight:800;letter-spacing:-.01em}
.costcard .capline .nm{color:var(--dim);font-size:12px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.costcard .capline .tag{font-size:11px;color:var(--dim2);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
.costgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px 12px;padding-top:11px}
.costgrid .cell{min-width:0}
.costgrid .cell .k{display:block;color:var(--dim);font-size:11.5px;margin-bottom:1px}
.costgrid .cell .v{font-size:15px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.costgrid .cell .v.strong{font-weight:800;font-size:16px}
.costgrid .cell .v small{font-weight:400;color:var(--dim);font-size:11.5px;margin-left:3px}
.costfoot{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface2);
  padding:13px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.costfoot .cell .k{display:block;color:var(--dim);font-size:11.5px}
.costfoot .cell .v{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}

.allocrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line2)}
.allocrow:last-of-type{border-bottom:0}
.favatar{width:36px;height:36px;border-radius:999px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:800;color:#fff}
.allocrow .mid{flex:1;min-width:0}
.allocrow .mid .top{display:flex;align-items:center;gap:8px;min-width:0}
.allocrow .mid .top b{font-size:14.5px;white-space:nowrap}
.allocrow .mid .top .nm{color:var(--dim);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.allocrow .mid .calc{color:var(--dim);font-size:12.5px;margin-top:2px;font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.allocrow .pctbox{display:flex;align-items:center;gap:3px;flex:0 0 auto}
.errline{color:#ff9aa2;font-size:12.5px;padding:0 0 9px}
.allocfoot{border-top:1px solid var(--line);margin-top:4px;padding-top:12px;
  display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.allocfoot .cell .k{display:block;color:var(--dim);font-size:11.5px}
.allocfoot .cell .v{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}

.flow{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line2)}
.flow:last-child{border-bottom:0}
.flow .fbody{flex:1;min-width:0}
.flow .fhead{font-size:14px}
.flow .fhead b{font-weight:800}
.flow .fhead time{color:var(--dim);font-weight:400;font-size:12.5px;margin-left:6px}
.flow .fmeta{color:var(--dim);font-size:12.5px;margin-top:2px;font-variant-numeric:tabular-nums}
.flow .fright{text-align:right;flex:0 0 auto;font-variant-numeric:tabular-nums}
.flow .fright b{font-size:14.5px;font-weight:800}
.flow .fright small{display:block;color:var(--dim);font-size:11.5px;margin-top:2px}

.editbox{display:none}
#poscard:not(.collapsed) .editbox{display:block}
.editnote{background:rgba(29,155,240,.09);border:1px solid rgba(29,155,240,.35);color:#bcd9f2;
  border-radius:var(--radius-sm);padding:10px 12px;font-size:12.5px;margin-bottom:12px;line-height:1.5}
.editnote b{color:#e7f3fd}
.posline{padding:12px 0;border-bottom:1px solid var(--line2)}
.posline:last-of-type{border-bottom:0}
.posline .pline1{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.posline .pline1 .sym{font-weight:800;font-size:14.5px}
.posline .pline1 .nm{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.posinputs{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.posinputs .unit{color:var(--dim);font-size:12.5px}
.posnums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 10px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line2)}
.posnums .cell .k{display:block;color:var(--dim);font-size:11px}
.posnums .cell .v{font-size:13.5px;font-variant-numeric:tabular-nums}

.sheet{position:fixed;inset:0;background:rgba(91,112,131,.4);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.sheet.on{display:flex}
.sheet .box{background:#000;border:1px solid var(--line);border-radius:var(--radius);padding:18px;width:100%;max-width:420px}
.sheet h3{font-size:18px;margin-bottom:4px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:14px;border-bottom:1px solid var(--line2)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--dim)}
.kv .v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 16px);
  background:var(--accent);color:#fff;padding:11px 16px;border-radius:999px;font-size:14px;font-weight:600;
  display:none;z-index:70;max-width:92vw;box-shadow:0 8px 28px rgba(0,0,0,.55);align-items:center;gap:12px}
.toast.on{display:flex}
.toast button{background:rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.empty{color:var(--dim);font-size:13.5px;padding:22px 4px;text-align:center;line-height:1.7}

@media (max-width:400px){
  .bignum>b{font-size:18px}
  .pctinput{width:56px}
  .posinput{width:92px}
  .legend .li .vl b{font-size:14.5px}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="titlerow">
    <h1>
      持仓助手
      <svg class="verified" viewBox="0 0 24 24" aria-hidden="true"><path d="M22.25 12c0-1.43-.88-2.67-2.19-3.34.46-1.39.2-2.9-.81-3.91s-2.52-1.27-3.91-.81C14.67 2.63 13.43 1.75 12 1.75s-2.67.88-3.34 2.19c-1.39-.46-2.9-.2-3.91.81s-1.27 2.52-.81 3.91C2.63 9.33 1.75 10.57 1.75 12s.88 2.67 2.19 3.34c-.46 1.39-.2 2.9.81 3.91s2.52 1.27 3.91.81c.67 1.31 1.91 2.19 3.34 2.19s2.67-.88 3.34-2.19c1.39.46 2.9.2 3.91-.81s1.27-2.52.81-3.91c1.31-.67 2.19-1.91 2.19-3.34zm-11.71 4.2L6.8 12.46l1.41-1.42 2.26 2.26 4.8-5.23 1.47 1.36-6.2 6.77z"/></svg>
    </h1>
    <button class="iconbtn" id="refreshbtn">刷新</button>
    <button class="iconbtn hide" id="exportbtn">导出</button>
    <button class="iconbtn hide" id="importbtn">导入</button>
    <input type="file" id="importfile" accept=".json,application/json" class="hide">
  </div>
  <div class="marketline"><span id="marketline">加载行情中…</span><span class="badge hide" id="storebadge"></span></div>
</div>

<div class="errbar" id="errbar"></div>

<div class="tabs">
  <button class="tab on" data-tab="holdings">持仓</button>
  <button class="tab" data-tab="buy">比例买入</button>
  <button class="tab" data-tab="flows">流水</button>
</div>

<div class="view on" id="view-holdings">
  <div class="quotes" id="quotes"></div>
  <div class="block" style="padding-top:12px;padding-bottom:12px"><div class="faint" id="quotefoot"></div></div>

  <div class="block collapsed" id="poscard">
    <div class="block-head">
      <div><h2>我的持仓</h2><div class="sub" id="holdsub">成本表只读；当日盈亏 =（现价 − 昨收）× 份额</div></div>
    </div>

    <div class="big" id="bigs"></div>

    <div class="donutwrap" style="margin:18px 0">
      <div class="donut" id="donut"><div class="inner"><b id="donutpct">0%</b><span>已建仓</span></div></div>
      <div class="legend" id="legend"></div>
    </div>

    <div class="costlist" id="costlist"></div>

    <div class="btn-row center">
      <button class="btn-ghost" id="editbtn">展开明细</button>
    </div>

    <div class="editbox">
      <div class="editnote"><b>改数据</b>：填好份额和每股成本价（成本价用含手续费的实际成本），然后点「保存持仓」。上面的成本表是只读的，用来核对。</div>
      <div id="poslines"></div>
      <div class="faint" id="posnote" style="margin-top:8px"></div>
      <div class="btn-row">
        <button class="btn btn-small" id="savepos">保存持仓</button>
        <button class="btn-ghost" id="clearpos">全部清零</button>
        <button class="btn-ghost" id="resetbase">重置当日基准</button>
      </div>
    </div>
  </div>
</div>

<div class="view" id="view-buy">
  <div class="section">
    <div class="block-head">
      <div><h2>按比例买入</h2><div class="sub">金额与手续费另计 · 最小 0.01 股 · 向下取整</div></div>
    </div>
    <div class="two-col" style="margin-bottom:6px">
      <div class="field"><label>总金额 $</label><input type="number" id="total" inputmode="decimal" step="1" min="0"></div>
      <div class="field"><label>手续费 %</label><input type="number" id="feerate" inputmode="decimal" step="0.01" min="0"></div>
    </div>
    <div id="allocbody"></div>
    <div id="allocfoot"></div>
    <div class="faint" id="allocnote" style="margin-top:10px"></div>
    <div class="btn-row">
      <button class="btn" id="buytargets">按配比全部买入</button>
      <button class="btn-ghost" id="fillsum">补齐到 100%</button>
      <button class="btn-ghost" id="preset-same">均分</button>
      <button class="btn-ghost" id="preset-last">恢复上次</button>
    </div>
  </div>
</div>

<div class="view" id="view-flows">
  <div class="section">
    <div class="block-head"><div><h2>买入流水</h2><div class="sub" id="flowsum"></div></div>
      <button class="btn-ghost" id="toggleimport">备份 / 迁移</button></div>
    <div class="editnote" id="importhelp" style="display:none">
      <b>导出</b>会下载一个 JSON（含配比、持仓、流水），可当备份保存，也可用于在另一台设备上恢复。<br>
      <b>导入</b>会用文件里的内容<b>整体覆盖</b>当前数据（只影响这一份数据，不会与云端合并）。导入前会有确认。
    </div>
    <div id="flows"></div>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="box">
    <h3 id="sheettitle">确认买入</h3>
    <p class="sub" id="sheetsub" style="margin:0 0 10px">确认后立即写入持仓与流水</p>
    <div id="sheetkv"></div>
    <div class="btn-row" style="margin-top:16px">
      <button class="btn" id="sheetok" style="flex:1">确认买入</button>
      <button class="btn-ghost" id="sheetcancel" style="flex:1">取消</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span id="toasttext"></span><button class="hide" id="toastundo">撤销</button><button id="toastclose">知道了</button></div>

<script>
'use strict';
const SYMBOLS = ['VOO','BRK.B','AAPL','PDD'];
const N = SYMBOLS.length;
const LOT = 0.01;
const COLORS = ['#1d9bf0','#f59e0b','#00ba7c','#a78bfa','#f472b6'];
const AVATAR_BG = { VOO:'#1d9bf0', 'BRK.B':'#f59e0b', AAPL:'#8b98a5', PDD:'#e0245e' };
const $ = (id) => document.getElementById(id);
const round2 = (n) => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
const roundLot = (n) => { const v = Number(n); return (!isFinite(v) || v <= 0) ? 0 : Math.floor(v * 100 + 1e-9) / 100; };
const money = (n, d = 2) => (n == null || !isFinite(n)) ? '—' : '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const signed = (n, d = 2) => (n == null || !isFinite(n)) ? '—' : (n > 0 ? '+' : n < 0 ? '−' : '') + '$' + Math.abs(Number(n)).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (n, d = 2) => (n == null || !isFinite(n)) ? '—' : (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(Number(n)).toFixed(d) + '%';
const cls = (n) => (n == null || !isFinite(n) || n === 0) ? 'flat' : (n > 0 ? 'up' : 'down');
const shares = (n) => { const s = (Number(n) || 0).toFixed(2); return s.replace(/\.00$/, '').replace(/(\.\d)0$/, '$1'); };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const avatarHtml = (s) => `<span class="qavatar" style="background:${AVATAR_BG[s] || '#536471'}">${esc(String(s).replace('.', '').slice(0, 4))}</span>`;
const smallAvatar = (s) => `<span class="favatar" style="background:${AVATAR_BG[s] || '#536471'}">${esc(String(s).replace('.', '').slice(0, 4))}</span>`;

const S = {
  quotes: {}, meta: null, rules: { feeRate: 0.001, lotSize: LOT },
  targets: { totalAmount: 3000, allocation: { VOO: 55, 'BRK.B': 25, AAPL: 12, PDD: 8 } },
  positions: {}, savedPositions: null, buys: [], holdings: null,
  pendingBuy: null,
  pendingImport: null,
  health: null,
};

let currentTab = 'holdings';
function switchTab(name) {
  currentTab = name;
  document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('on', b.dataset.tab === name));
  document.querySelectorAll('.view').forEach((v) => v.classList.toggle('on', v.id === `view-${name}`));
  if (name === 'buy') renderAllocation();
  if (name === 'holdings') { renderPositionLines(); syncPositionTotals(); }
}
document.querySelectorAll('.tab').forEach((b) => { b.onclick = () => switchTab(b.dataset.tab); });

async function api(path, opts = {}) {
  const res = await fetch(path, {
    method: opts.method || 'GET',
    headers: opts.body ? { 'Content-Type': 'application/json' } : undefined,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch { /* 空响应 */ }
  if (!res.ok) throw new Error((data && data.error) || ('请求失败 ' + res.status));
  return data;
}

function showErr(msg) {
  const el = $('errbar');
  if (!msg) { el.classList.remove('on'); return; }
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(showErr.t);
  showErr.t = setTimeout(() => el.classList.remove('on'), 6500);
}

let toastTimer = null;
function toast(msg, { undo = false } = {}) {
  $('toasttext').textContent = msg;
  $('toastundo').classList.toggle('hide', !undo);
  $('toast').classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('on'), undo ? 9000 : 4200);
}
$('toastclose').onclick = () => $('toast').classList.remove('on');

function sanitizePct(raw) {
  const intPart = String(raw ?? '').split('.')[0];
  const digits = intPart.replace(/[^\d]/g, '').slice(0, 3);
  if (digits === '') return '';
  return String(Math.min(100, Number(digits)));
}

function autoFixSum(editedSymbol) {
  const a = computeAllocation();
  const gap = round2(100 - a.sum);
  if (Math.abs(gap) < 0.5) return null;
  const others = SYMBOLS.filter((s) => s !== editedSymbol);
  const donors = others.map((s) => ({ s, v: Number(document.querySelector(`[data-pct="${s}"]`)?.value) || 0 }));
  donors.sort((x, y) => (gap > 0 ? y.v - x.v : x.v - y.v));
  for (const d of donors) {
    const next = Math.round(d.v + gap);
    if (next >= 0 && next <= 100) {
      document.querySelector(`[data-pct="${d.s}"]`).value = String(next);
      showErr(`已自动把差额 ${gap > 0 ? '+' : ''}${gap}% 放到 ${d.s}（${d.v}% → ${next}%）`);
      return d.s;
    }
  }
  return null;
}

function computeAllocation() {
  const total = Number($('total').value);
  const feeRate = Number($('feerate').value) / 100;
  const alloc = {};
  for (const s of SYMBOLS) {
    const el = document.querySelector(`[data-pct="${s}"]`);
    const raw = el ? el.value : S.targets?.allocation?.[s];
    const v = Number(raw);
    alloc[s] = Number.isFinite(v) ? v : Number(S.targets?.allocation?.[s]) || 0;
  }

  const sum = SYMBOLS.reduce((a, s) => a + (Number.isFinite(alloc[s]) ? alloc[s] : 0), 0);
  const sumRaw = round2(100 - sum);
  const out = { total, feeRate, alloc, sum, sumRaw, sumOk: Math.abs(sum - 100) <= 0.01, errors: [], lines: [], ok: false };

  const totalOk = Number.isFinite(total) && total > 0;
  const feeOk = Number.isFinite(feeRate) && feeRate >= 0 && feeRate <= 0.05;
  if (!totalOk) out.errors.push('总金额必须是大于 0 的数字');
  if (!feeOk) out.errors.push('手续费率应为 0 ~ 5%');
  if (!out.sumOk) out.errors.push(`${N} 个百分比之和是 ${Number(sum.toFixed(2))}%，还差 ${Math.abs(sumRaw).toFixed(2)}%（${sumRaw > 0 ? '少' : '超'}了）`);

  let stockTotal = 0, feeTotal = 0, chargeTotal = 0, residTotal = 0;
  for (const s of SYMBOLS) {
    const amount = totalOk ? round2(total * alloc[s] / 100) : 0;
    const price = S.quotes[s]?.price ?? null;
    const line = {
      symbol: s, pct: alloc[s], amount, price, shares: 0, stockCost: 0, fee: 0,
      totalCharge: 0, residual: amount, minAmount: null, error: null, ok: false,
    };
    if (!totalOk || !feeOk) { out.lines.push(line); continue; }
    if (alloc[s] === 0) { line.ok = true; line.residual = 0; out.lines.push(line); continue; }
    if (!price) {
      line.error = '拿不到实时价格，暂时无法计算';
      out.errors.push(`${s}: ${line.error}`);
      out.lines.push(line);
      continue;
    }
    const sh = roundLot(amount / price);
    const minAmount = round2(LOT * price * (1 + feeRate));
    if (sh <= 0) {
      line.error = `不足 0.01 股，该只最少 $${minAmount.toFixed(2)}`;
      out.errors.push(`${s}: ${line.error}`);
      out.lines.push(line);
      continue;
    }
    line.shares = sh;
    line.stockCost = round2(sh * price);
    line.fee = round2(amount * feeRate);
    line.totalCharge = round2(line.stockCost + line.fee);
    line.residual = round2(amount - line.stockCost);
    line.minAmount = minAmount;
    line.ok = true;
    stockTotal = round2(stockTotal + line.stockCost);
    feeTotal = round2(feeTotal + line.fee);
    chargeTotal = round2(chargeTotal + line.totalCharge);
    residTotal = round2(residTotal + line.residual);
    out.lines.push(line);
  }
  out.ok = out.errors.length === 0;
  out.summary = { stockTotal, feeTotal, chargeTotal, residTotal, extra: round2(chargeTotal - (totalOk ? total : 0)) };
  return out;
}

function renderAllocation({ fillInputs = false } = {}) {
  if (fillInputs && S.targets) {
    $('total').value = S.targets.totalAmount;
    $('feerate').value = (Number(S.rules.feeRate) * 100).toFixed(2).replace(/\.?0+$/, '');
    for (const s of SYMBOLS) {
      const el = document.querySelector(`[data-pct="${s}"]`);
      if (el) el.value = String(Math.round(Number(S.targets.allocation[s]) || 0));
    }
  }

  const a = computeAllocation();
  // 只能数 .allocrow（每只还带一条隐藏错误行），否则判定永远不成立、每次输入都重建整个列表
  const built = document.querySelectorAll('#allocbody .allocrow').length === N
    && SYMBOLS.every((s) => document.querySelector(`[data-pct="${s}"]`));

  if (!built) {
    $('allocbody').innerHTML = SYMBOLS.map((s) => `
      <div class="allocrow" data-row="${esc(s)}">
        ${smallAvatar(s)}
        <div class="mid">
          <div class="top"><b>${esc(s)}</b><span class="nm">${esc(S.quotes[s]?.name || '')}</span></div>
          <div class="calc" data-cell="${esc(s)}-calc"></div>
        </div>
        <div class="pctbox">
          <input class="pctinput" type="number" inputmode="numeric" step="1" min="0" max="100" data-pct="${esc(s)}" value="${Math.round(a.alloc[s])}">
          <span class="dim">%</span>
        </div>
        <span data-cell="${esc(s)}-buy"></span>
      </div>
      <div class="errline" data-err="${esc(s)}" style="display:none"></div>
    `).join('');
  }

  const setCell = (id, html) => { const el = document.querySelector(`[data-cell="${id}"]`); if (el) el.innerHTML = html; };

  for (const s of SYMBOLS) {
    const el = document.querySelector(`[data-pct="${s}"]`);
    if (el && el.dataset.bound !== '1') {
      el.dataset.bound = '1';
      el.oninput = () => {
        const el2 = document.querySelector(`[data-pct="${s}"]`);
        const cleaned = sanitizePct(el2.value);
        if (cleaned !== el2.value) el2.value = cleaned;
        renderAllocation();
        scheduleSaveTargets();
      };
      el.onchange = () => {
        const el2 = document.querySelector(`[data-pct="${s}"]`);
        el2.value = String(Math.max(0, Math.min(100, Math.round(Number(el2.value) || 0))));
        autoFixSum(s);
        renderAllocation();
        saveTargets({ quiet: true });
      };
    }
  }

  let feeTotal = 0;
  let chargeTotal = 0;
  for (const l of a.lines) {
    const calc = l.ok
      ? `${money(l.amount)} → ${shares(l.shares)} 股 · 费 ${money(l.fee)} · <span class="dim">扣 ${money(l.totalCharge)}</span>`
      : `<span class="dim">${l.pct === 0 ? '不买这一只' : (l.error || '等待行情')}</span>`;
    setCell(`${l.symbol}-calc`, calc);
    setCell(`${l.symbol}-buy`, l.ok && l.shares > 0
      ? `<button class="btn btn-small" data-buy="${esc(l.symbol)}">买入</button>`
      : '');
    const errRow = document.querySelector(`.errline[data-err="${l.symbol}"]`);
    if (errRow) {
      if (l.error) { errRow.style.display = ''; errRow.textContent = l.error; }
      else errRow.style.display = 'none';
    }
    if (l.ok) { feeTotal = round2(feeTotal + l.fee); chargeTotal = round2(chargeTotal + l.totalCharge); }
  }

  $('allocfoot').innerHTML = `<div class="allocfoot">
      <div class="cell"><span class="k">买入金额合计</span><span class="v">${money(a.total)}</span></div>
      <div class="cell"><span class="k">实际扣款合计</span><span class="v">${money(chargeTotal)}</span></div>
      <div class="cell"><span class="k">手续费合计</span><span class="v">${money(feeTotal)}</span></div>
      <div class="cell"><span class="k">占比合计</span><span class="v ${a.sumOk ? 'flat' : 'up'}">${Number(a.sum).toFixed(2)}%${a.sumOk ? '' : ` (还差 ${Math.abs(a.sumRaw).toFixed(2)}%)`}</span></div>
    </div>`;

  const notes = [];
  if (!a.sumOk) {
    notes.push(a.sumRaw > 0
      ? `还差 ${a.sumRaw.toFixed(2)}%：把剩下的比例分给某只（或点「补齐到 100%」）`
      : `超出 ${Math.abs(a.sumRaw).toFixed(2)}%：请减少某只的比例`);
  } else {
    const diff = round2(chargeTotal - a.total);
    if (diff > 0.004) notes.push(`实际扣款比总金额多 ${money(diff)}（手续费）`);
    else if (diff < -0.004) notes.push(`实际扣款 ${money(chargeTotal)}：${money(-diff)} 因 0.01 股取整没花出去，手续费 ${money(feeTotal)} 已含在内`);
    else notes.push(`实际扣款 ${money(chargeTotal)}，与总金额一致（手续费 ${money(feeTotal)} 已含在内）`);
    notes.push(`未用余额合计 ${money(a.summary.residTotal)}`);
  }
  $('allocnote').textContent = notes.join(' · ');

  const fillBtn = $('fillsum');
  if (fillBtn) {
    fillBtn.disabled = a.sumOk;
    fillBtn.textContent = a.sumOk ? '已配平 100%' : `补齐到 100%（+${a.sumRaw > 0 ? a.sumRaw.toFixed(2) : '0.00'}%）`;
  }
  $('buytargets').disabled = !a.ok;
}

let saveTimer = null;
function scheduleSaveTargets() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const a = computeAllocation();
    if (a.sumOk && a.total > 0) saveTargets({ quiet: true });
  }, 900);
}
async function saveTargets({ quiet = false } = {}) {
  const alloc = {};
  let sum = 0;
  for (const s of SYMBOLS) {
    const v = Number(document.querySelector(`[data-pct="${s}"]`)?.value ?? 0);
    alloc[s] = Number.isFinite(v) ? v : 0;
    sum += alloc[s];
  }
  const totalAmount = Number($('total').value);
  const feeRate = Number($('feerate').value) / 100;
  // 没配平、或总金额/费率不合法就坚决不落库——否则坏值会写进 state.json
  if (Math.abs(sum - 100) > 0.01) { if (!quiet) showErr(`配比之和是 ${Number(sum.toFixed(2))}%，没配平就不会保存`); return; }
  if (!Number.isFinite(totalAmount) || totalAmount <= 0) { if (!quiet) showErr('总金额必须是大于 0 的数字，未保存'); return; }
  if (!Number.isFinite(feeRate) || feeRate < 0 || feeRate > 0.05) { if (!quiet) showErr('手续费率应为 0 ~ 5%，未保存'); return; }
  try {
    const r = await api('/api/targets', { method: 'POST', body: { totalAmount, allocation: alloc, feeRate } });
    S.targets = r.targets; S.rules = r.rules;
    $('feerate').value = (S.rules.feeRate * 100).toFixed(2).replace(/\.?0+$/, '');
  } catch (e) {
    if (!quiet) showErr('配比没保存：' + e.message);
  }
}

function fillRemainder() {
  const a = computeAllocation();
  const gap = round2(100 - a.sum);
  if (Math.abs(gap) < 0.005) { toast('配比已经是 100%'); return; }
  const target = SYMBOLS[SYMBOLS.length - 1];
  const el = document.querySelector(`[data-pct="${target}"]`);
  const next = round2((Number(el.value) || 0) + gap);
  if (next < 0 || next > 100) {
    showErr(`补齐后 ${target} 会变成 ${next}%，超出 0~100%，请手动调整`);
    return;
  }
  el.value = next;
  renderAllocation();
  saveTargets({ quiet: true });
  toast(`已把 ${gap > 0 ? '+' : ''}${gap.toFixed(2)}% 加到 ${target}`);
}

function renderQuotes() {
  $('quotes').innerHTML = SYMBOLS.map((s) => {
    const q = S.quotes[s];
    if (!q) return `<div class="qrow">${avatarHtml(s)}<div class="qmain"><div class="qname">${esc(s)}</div><div class="qmeta">无数据</div></div></div>`;
    const badge = q.stale ? '<span class="badge warn">旧价</span>'
      : q.source === 'sina' ? '<span class="badge alt">备用源</span>' : '';
    return `<div class="qrow">
      ${avatarHtml(s)}
      <div class="qmain">
        <div class="qname">${esc(q.name || s)}<span class="code">${esc(s)}</span>${badge}</div>
        <div class="qmeta">昨收 ${money(q.prevClose)} · ${esc((q.quoteTime || '').slice(5, 16) || '—')}</div>
      </div>
      <div class="qprice">
        <b class="mono">${money(q.price)}</b>
        <small class="${cls(q.change)}">${signed(q.change)} (${pct(q.changePct)})</small>
      </div>
    </div>`;
  }).join('');

  const m = S.meta || {};
  $('marketline').textContent = `${m.marketStateLabel || '未知'} · 行情时间 ${m.asOf || '—'}${m.stale ? ' · 数据可能已过期' : ''}`;
  const parts = [];
  if (m.marketState && m.marketState !== 'open') parts.push('当前非交易时段，行情为最近一次成交价，「当日盈亏」不会有变化。');
  if (S.quotes['BRK.B']?.source === 'sina') parts.push('BRK.B 走的是备用行情源。');
  $('quotefoot').textContent = parts.join(' ');
}

function renderHoldings() {
  const h = S.holdings;
  if (!h) return;
  syncPositionTotals();

  const note = [];
  const staleCount = h.lines.filter((l) => l.stale).length;
  if (staleCount) note.push(`${staleCount} 只用的是上次成功价格`);
  const dirty = SYMBOLS.some((s) => {
    const p = S.savedPositions?.[s] || {};
    const c = S.positions?.[s] || {};
    return round2(Number(p.shares) || 0) !== round2(Number(c.shares) || 0)
      || round2(Number(p.avgCost) || 0) !== round2(Number(c.avgCost) || 0);
  });
  if (dirty) note.push('有改动尚未保存，点「展开明细」去保存');
  $('holdsub').textContent = (note.length ? note.join(' · ') + ' · ' : '')
    + '成本表只读；当日盈亏 =（现价 − 昨收）× 份额';

  renderFlows();
}

function renderPositionLines() {
  const box = $('poslines');
  if (!box) return;
  box.innerHTML = SYMBOLS.map((s) => {
    const p = S.positions[s] || { shares: 0, avgCost: 0 };
    return `<div class="posline" data-line="${esc(s)}">
      <div class="pline1"><span class="sym">${esc(s)}</span><span class="nm">${esc(S.quotes[s]?.name || '')}</span>
        <span class="dim" style="margin-left:auto;font-size:12.5px" data-line-w="${esc(s)}"></span></div>
      <div class="posinputs">
        <span class="unit">持有份额</span>
        <input class="posinput" type="number" inputmode="decimal" step="0.01" min="0" data-line-in="${esc(s)}-shares" value="${Number(p.shares) || 0}" placeholder="0">
        <span class="unit">股 × 成本价</span>
        <input class="posinput" type="number" inputmode="decimal" step="0.01" min="0" data-line-in="${esc(s)}-cost" value="${round2(Number(p.avgCost) || 0)}" placeholder="0">
      </div>
      <div class="posnums">
        <div class="cell"><span class="k">市值</span><span class="v" data-line-mv="${esc(s)}">—</span></div>
        <div class="cell"><span class="k">当日盈亏</span><span class="v" data-line-day="${esc(s)}">—</span></div>
        <div class="cell"><span class="k">累计盈亏</span><span class="v" data-line-tot="${esc(s)}">—</span></div>
      </div>
    </div>`;
  }).join('');

  for (const s of SYMBOLS) {
    S.positions[s] = S.positions[s] || { shares: 0, avgCost: 0, baselinePrevClose: null };
    ['shares', 'cost'].forEach((k) => {
      const el = document.querySelector(`[data-line-in="${s}-${k}"]`);
      if (!el) return;
      el.oninput = () => {
        S.positions[s][k === 'shares' ? 'shares' : 'avgCost'] = Number(el.value) || 0;
        syncPositionTotals();
      };
    });
  }
  syncPositionTotals();
}

function syncPositionLines() {
  for (const s of SYMBOLS) {
    const p = S.positions[s] || {};
    for (const k of ['shares', 'cost']) {
      const el = document.querySelector(`[data-line-in="${s}-${k}"]`);
      if (!el) continue;
      const next = String(k === 'shares' ? (Number(p.shares) || 0) : round2(Number(p.avgCost) || 0));
      if (el.value !== next) el.value = next;
    }
  }
}

function syncPositionTotals() {
  const mv = {};
  let marketTotal = 0;
  let costTotal = 0;
  let dayTotal = 0;
  const qty = {};
  for (const s of SYMBOLS) {
    const p = S.positions[s] || { shares: 0, avgCost: 0 };
    qty[s] = { shares: Number(p.shares) || 0, avgCost: Number(p.avgCost) || 0 };
    const q = S.quotes[s] || null;
    const price = q?.price ?? null;
    mv[s] = price != null ? round2(qty[s].shares * price) : null;
    if (mv[s] != null) marketTotal = round2(marketTotal + mv[s]);
    costTotal = round2(costTotal + round2(qty[s].shares * qty[s].avgCost));
  }

  for (const s of SYMBOLS) {
    const q = S.quotes[s] || null;
    const price = q?.price ?? null;
    const prev = q?.prevClose ?? null;
    const { shares: sh, avgCost } = qty[s];
    const day = price != null && prev != null ? round2((price - prev) * sh) : null;
    const dayPct = price != null && prev ? Number((((price - prev) / prev) * 100).toFixed(2)) : null;
    const costValue = round2(sh * avgCost);
    const total = mv[s] != null ? round2(mv[s] - costValue) : null;
    const totalPct = mv[s] != null && costValue > 0 ? Number((((mv[s] - costValue) / costValue) * 100).toFixed(2)) : null;
    if (day != null) dayTotal = round2(dayTotal + day);

    const w = document.querySelector(`[data-line-w="${s}"]`);
    if (w) w.textContent = dayPct == null ? '' : pct(dayPct);
    const lmv = document.querySelector(`[data-line-mv="${s}"]`);
    if (lmv) lmv.textContent = mv[s] == null ? '—' : money(mv[s]);
    const lday = document.querySelector(`[data-line-day="${s}"]`);
    if (lday) { lday.className = `v ${cls(day)}`; lday.textContent = signed(day); }
    const ltot = document.querySelector(`[data-line-tot="${s}"]`);
    if (ltot) { ltot.className = `v ${cls(total)}`; ltot.textContent = total == null ? '—' : `${signed(total)}${totalPct == null ? '' : ' (' + pct(totalPct) + ')'}`; }
  }

  const totalPnl = round2(marketTotal - costTotal);
  const pctOf = (v) => (costTotal > 0 && v != null ? Number(((v / costTotal) * 100).toFixed(2)) : null);
  const feesPaid = round2((S.buys || []).reduce((a, b) => a + (Number(b.fee) || 0), 0));
  const invested = round2((S.buys || []).reduce((a, b) => a + (Number(b.totalCharge) || 0), 0));
  if ($('bigs')) {
    $('bigs').innerHTML = `
      <div class="bignum"><span>组合总市值</span><b class="mono">${money(marketTotal)}</b><em class="faint">含费成本 ${money(costTotal)}</em></div>
      <div class="bignum"><span>当日盈亏</span><b class="mono ${cls(dayTotal)}">${signed(dayTotal)}</b><em class="${cls(dayTotal)}">${pct(pctOf(dayTotal))}</em></div>
      <div class="bignum"><span>累计浮动盈亏</span><b class="mono ${cls(totalPnl)}">${signed(totalPnl)}</b><em class="${cls(totalPnl)}">${pct(pctOf(totalPnl))}</em></div>
      <div class="bignum"><span>累计投入（含费）</span><b class="mono">${money(invested)}</b><em class="faint">手续费共 ${money(feesPaid)}</em></div>`;
  }

  paintDonut(SYMBOLS.map((s, i) => ({
    symbol: s,
    name: S.quotes[s]?.name || '',
    color: COLORS[i % COLORS.length],
    weightPct: marketTotal > 0 && mv[s] != null ? (mv[s] / marketTotal) * 100 : 0,
    marketValue: mv[s] || 0,
  })));

  if ($('costlist')) {
    $('costlist').innerHTML = SYMBOLS.map((s) => {
      const q = S.quotes[s] || null;
      const { shares: sh, avgCost } = qty[s];
      const costValue = round2(sh * avgCost);
      const weight = marketTotal > 0 && mv[s] != null ? (mv[s] / marketTotal) * 100 : 0;
      const held = sh > 0;
      const pnl = held && mv[s] != null ? round2(mv[s] - costValue) : null;
      const pnlPct = held && costValue > 0 && mv[s] != null ? Number((((mv[s] - costValue) / costValue) * 100).toFixed(2)) : null;
      const day = held && q?.price != null && q?.prevClose != null ? round2((q.price - q.prevClose) * sh) : null;
      return `<div class="costcard">
        <div class="capline">
          <span class="sym">${esc(s)}</span>
          <span class="nm">${esc(q?.name || '')}</span>
          <span class="tag">占比 ${weight.toFixed(1)}%</span>
        </div>
        <div class="costgrid">
          <div class="cell"><span class="k">持有份额</span><span class="v">${shares(sh)}<small>股</small></span></div>
          <div class="cell"><span class="k">每股成本</span><span class="v">${held && avgCost > 0 ? money(avgCost) : '<span class="faint">未持有</span>'}</span></div>
          <div class="cell"><span class="k">持仓成本</span><span class="v strong">${held && costValue > 0 ? money(costValue) : '—'}</span></div>
          <div class="cell"><span class="k">现价 → 市值</span><span class="v">${q?.price != null ? money(q.price) : '—'}<small>${mv[s] == null ? '' : '→ ' + money(mv[s])}</small></span></div>
          <div class="cell"><span class="k">累计盈亏</span><span class="v ${cls(pnl)}">${held ? `${signed(pnl)}<small>${pnlPct == null ? '' : pct(pnlPct)}</small>` : '—'}</span></div>
          <div class="cell"><span class="k">当日盈亏</span><span class="v ${cls(day)}">${held ? signed(day) : '—'}</span></div>
        </div>
      </div>`;
    }).join('') + `<div class="costfoot">
        <div class="cell"><span class="k">合计持有份额</span><span class="v">${shares(SYMBOLS.reduce((a, s) => a + qty[s].shares, 0))}</span></div>
        <div class="cell"><span class="k">持仓成本合计</span><span class="v">${money(costTotal)}</span></div>
        <div class="cell"><span class="k">市值合计</span><span class="v">${money(marketTotal)}</span></div>
        <div class="cell"><span class="k">累计浮动盈亏</span><span class="v ${cls(totalPnl)}">${signed(totalPnl)}</span></div>
      </div>`;
  }

  const n = SYMBOLS.filter((s) => qty[s].shares > 0).length;
  const dirtyCount = SYMBOLS.filter((s) => {
    const p = S.savedPositions?.[s] || {};
    return round2(Number(p.shares) || 0) !== round2(qty[s].shares)
      || round2(Number(p.avgCost) || 0) !== round2(qty[s].avgCost);
  }).length;
  if ($('posnote')) {
    const bits = [];
    bits.push(n ? `已录入 ${n} 只` : '还没有录入任何持仓，填好份额和成本价后点「保存持仓」');
    bits.push(`总市值 ${money(marketTotal)}`);
    bits.push(`含费成本 ${money(costTotal)}`);
    if (dirtyCount) bits.push(`有 ${dirtyCount} 只改动尚未保存`);
    $('posnote').textContent = bits.join(' · ');
  }
}

function paintDonut(items) {
  const active = items.filter((it) => it.weightPct > 0);
  const legend = $('legend');
  if (!active.length) {
    $('donut').style.background = 'conic-gradient(#2f3336 0 100%)';
    $('donutpct').textContent = '0%';
  } else {
    const segs = [];
    let acc = 0;
    for (const it of active) {
      segs.push(`${it.color} ${acc}% ${acc + it.weightPct}%`);
      acc += it.weightPct;
    }
    if (acc < 100) segs.push(`#2f3336 ${acc}% 100%`);
    $('donut').style.background = `conic-gradient(${segs.join(',')})`;
    $('donutpct').textContent = Math.round(acc) + '%';
  }
  if (legend) {
    legend.innerHTML = items.map((it) => `<div class="li">
      <span class="dot" style="background:${it.color}"></span>
      <span class="nm"><b>${esc(it.symbol)}</b><small>${esc(it.name || '')}</small></span>
      <span class="vl"><b>${it.weightPct.toFixed(1)}%</b><small>${money(it.marketValue)}</small></span></div>`).join('');
  }
}

async function savePositions() {
  const positions = {};
  for (const s of SYMBOLS) {
    positions[s] = {
      shares: Number(S.positions[s]?.shares) || 0,
      avgCost: Number(S.positions[s]?.avgCost) || 0,
    };
  }
  try {
    const r = await api('/api/positions', { method: 'POST', body: { positions } });
    S.positions = r.positions;
    S.savedPositions = structuredClone(r.positions);
    S.holdings = r.holdings;
    renderPositionLines();
    syncPositionLines();
    renderHoldings();
    const n = SYMBOLS.filter((s) => positions[s].shares > 0).length;
    toast(n ? `已保存 ${n} 只持仓` : '持仓已清空');
  } catch (e) { showErr('保存持仓失败：' + e.message); }
}

function renderFlows() {
  const buys = S.holdings?.buys || S.buys || [];
  if (!buys.length) {
    $('flows').innerHTML = '<div class="empty">还没有买入记录。<br>去「比例买入」页按配比买一笔试试。</div>';
    $('flowsum').textContent = '';
    return;
  }
  const totalFee = round2(buys.reduce((a, b) => a + (Number(b.fee) || 0), 0));
  const totalCharge = round2(buys.reduce((a, b) => a + (Number(b.totalCharge) || 0), 0));
  $('flowsum').textContent = `${buys.length} 笔 · 扣款合计 ${money(totalCharge)} · 手续费 ${money(totalFee)}`;
  $('flows').innerHTML = buys.map((b) => `<div class="flow">
      ${smallAvatar(b.symbol)}
      <div class="fbody">
        <div class="fhead"><b>${esc(b.symbol)}</b> 买入 ${shares(b.shares)} 股 <time>${esc((b.at || '').replace('T', ' ').slice(0, 16))}</time></div>
        <div class="fmeta">成交价 ${money(b.price)} · 含费成本价 ${money(b.newAvgCost)}</div>
      </div>
      <div class="fright"><b>${money(b.totalCharge)}</b><small>手续费 ${money(b.fee)}</small></div>
    </div>`).join('');
}

function openSheet(pending) {
  S.pendingBuy = pending;
  $('sheettitle').textContent = pending.kind === 'all' ? '按配比全部买入' : `买入 ${pending.symbol}`;
  $('sheetsub').textContent = '确认后立即写入持仓与流水';
  const rows = [];
  for (const l of pending.lines) {
    rows.push(`<div class="kv"><span class="k">${esc(l.symbol)} @ ${money(l.price)}</span><span class="v">${shares(l.shares)} 股</span></div>`);
    rows.push(`<div class="kv"><span class="k" style="padding-left:14px">买入金额 / 手续费</span><span class="v">${money(l.amount)} / ${money(l.fee)}</span></div>`);
    rows.push(`<div class="kv"><span class="k" style="padding-left:14px">实际扣款</span><span class="v">${money(l.totalCharge)}</span></div>`);
  }
  rows.push(`<div class="kv"><span class="k"><b>合计扣款</b></span><span class="v">${money(pending.totalCharge)}</span></div>`);
  $('sheetkv').innerHTML = rows.join('');
  $('sheet').classList.add('on');
}
const closeSheet = () => {
  $('sheet').classList.remove('on');
  S.pendingBuy = null;
  S.pendingImport = null;
  $('sheetok').textContent = '确认买入';
};
$('sheetcancel').onclick = closeSheet;
$('sheet').onclick = (e) => { if (e.target === $('sheet')) closeSheet(); };

$('sheetok').onclick = async () => {
  // 导入走独立分支：它与买入共用同一个弹层，但确认后做的是整份覆盖
  if (S.pendingImport) {
    const payload = S.pendingImport;
    $('sheetok').disabled = true;
    try {
      const r = await api('/api/import', { method: 'POST', body: payload });
      S.positions = r.positions || payload.positions;
      S.savedPositions = structuredClone(S.positions);
      S.holdings = r.holdings;
      S.targets = r.targets || payload.targets || S.targets;
      S.pendingImport = null;
      closeSheet();
      renderAllocation({ fillInputs: true });
      renderPositionLines();
      syncPositionLines();
      renderHoldings();
      await refreshHealth();
      toast('已导入备份');
    } catch (e) {
      showErr('导入失败：' + e.message);
    } finally {
      $('sheetok').disabled = false;
    }
    return;
  }

  const p = S.pendingBuy;
  if (!p) return;
  $('sheetok').disabled = true;
  let last = null;
  try {
    for (const l of p.lines) {
      const r = await api('/api/buy', { method: 'POST', body: { symbol: l.symbol, amount: l.amount, feeRate: p.feeRate } });
      last = r;
      if (r.positions) { S.positions = r.positions; S.savedPositions = structuredClone(r.positions); }
      S.holdings = r.holdings;
      if (r.quotes) S.quotes = r.quotes;
      S.buys = [r.buy, ...S.buys];
    }
    closeSheet();
    renderPositionLines();
    renderHoldings();
    renderQuotes();
    toast(`已买入 ${p.lines.map((l) => l.symbol + ' ' + shares(l.shares) + ' 股').join('、')}，合计扣款 ${money(p.totalCharge)}`, { undo: true });
  } catch (e) {
    showErr('买入失败：' + e.message);
    if (last) { renderPositionLines(); renderHoldings(); }
  } finally {
    $('sheetok').disabled = false;
  }
};

$('toastundo').onclick = async () => {
  try {
    const r = await api('/api/buys/last', { method: 'DELETE' });
    if (r.positions) { S.positions = r.positions; S.savedPositions = structuredClone(r.positions); }
    S.holdings = r.holdings;
    S.buys = S.buys.slice(1);
    renderPositionLines();
    renderHoldings();
    toast(`已撤销 ${r.undone.symbol} 的买入`);
  } catch (e) { showErr('撤销失败：' + e.message); }
};

function toggleEdit() {
  const collapsed = $('poscard').classList.toggle('collapsed');
  $('editbtn').textContent = collapsed ? '展开明细' : '收起修改区';
  if (!collapsed) {
    renderPositionLines();
    requestAnimationFrame(() => $('poslines')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' }));
  }
  syncPositionTotals();
}

/* ------------------------------ 存储状态 / 备份迁移 ------------------------------ */

/** 顶栏胶囊：告诉用户数据存在哪、有没有降级 */
function renderStorageBadge(health) {
  const el = $('storebadge');
  if (!el) return;
  if (!health) { el.classList.add('hide'); return; }
  el.classList.remove('hide', 'warn', 'alt');
  if (health.degraded) {
    el.classList.add('warn');
    el.textContent = '云存储异常 · 只读';
    el.title = `云存储不可用，正在用上次同步的本地副本，改动不会保存。原因：${health.degradedReason || '未知'}`;
  } else if (health.storage === 'kv') {
    el.textContent = '云同步';
    el.title = `数据存在云端（${health.storageTarget}），电脑关机也能用`;
  } else {
    el.classList.add('alt');
    el.textContent = '本机文件';
    el.title = `数据存在这台电脑上（${health.storageTarget}）`;
  }
}

async function refreshHealth() {
  try {
    const h = await api('/api/health');
    renderStorageBadge(h);
    return h;
  } catch {
    renderStorageBadge(null);
    return null;
  }
}

async function exportBackup() {
  try {
    const r = await api('/api/export');
    const stamp = new Date().toISOString().slice(0, 10);
    const blob = new Blob([JSON.stringify(r.state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `stock-backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('已导出备份文件');
  } catch (e) { showErr('导出失败：' + e.message); }
}

function renderImportSheet(payload) {
  const pos = payload?.positions || {};
  const rows = SYMBOLS.map((s) => {
    const p = pos[s] || {};
    return `<div class="kv"><span class="k">${esc(s)} 持仓</span><span class="v">${shares(p.shares || 0)} 股 @ ${p.avgCost ? money(p.avgCost) : '—'}</span></div>`;
  }).join('');
  const alloc = payload?.targets?.allocation || {};
  $('sheettitle').textContent = '导入备份（会覆盖当前数据）';
  $('sheetsub').textContent = `文件里的导出时间：${payload?.updatedAt ? String(payload.updatedAt).replace('T', ' ').slice(0, 16) : '未标注'}`;
  $('sheetkv').innerHTML = rows
    + `<div class="kv"><span class="k">配比</span><span class="v">${SYMBOLS.map((s) => `${esc(s)} ${alloc[s] ?? 0}%`).join(' / ')}</span></div>`
    + `<div class="kv"><span class="k">流水</span><span class="v">${Array.isArray(payload?.buys) ? payload.buys.length : 0} 笔</span></div>`;
  $('sheetok').textContent = '确认导入';
  $('sheet').classList.add('on');
}

function handleImportFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let payload;
    try { payload = JSON.parse(String(reader.result)); } catch { showErr('导入失败：文件不是合法 JSON'); return; }
    const inner = payload?.state ?? payload;
    if (!inner || (!inner.targets && !inner.positions)) {
      showErr('导入失败：这不是一份持仓备份（缺少 targets / positions）');
      return;
    }
    S.pendingImport = inner;
    renderImportSheet(inner);
  };
  reader.onerror = () => showErr('读取文件失败');
  reader.readAsText(file);
}

async function refreshQuotes(force = false) {
  const r = await api('/api/quotes' + (force ? '?force=1' : ''));
  S.quotes = r.quotes; S.meta = r.meta; S.rules = r.rules || S.rules;
  renderQuotes();
}
async function refreshAll({ force = false } = {}) {
  try {
    $('refreshbtn').textContent = '刷新中';
    $('refreshbtn').disabled = true;
    const [st, hl] = await Promise.all([
      api('/api/state'),
      api('/api/holdings'),
      refreshQuotes(force),
    ]);
    S.targets = st.targets; S.rules = st.rules || S.rules; S.buys = st.buys;
    S.holdings = hl;
    // 服务端持仓是「已保存」的真相；用户填的还没保存就不要冲掉
    const serverPos = hl.positions || st.positions;
    const saved = structuredClone(serverPos);
    const hasDraft = S.positions && S.savedPositions
      && SYMBOLS.some((s) => round2(Number(S.positions[s]?.shares)) !== round2(Number(S.savedPositions[s]?.shares))
        || round2(Number(S.positions[s]?.avgCost)) !== round2(Number(S.savedPositions[s]?.avgCost)));
    S.savedPositions = saved;
    if (!hasDraft) S.positions = structuredClone(serverPos);
    const typing = document.activeElement && ['INPUT'].includes(document.activeElement.tagName);
    const noInputsYet = !document.querySelector('[data-pct]');
    renderAllocation({ fillInputs: !typing || noInputsYet });
    renderPositionLines();
    syncPositionLines();
    renderHoldings();
    showErr('');
  } catch (e) {
    showErr(e.message || '加载失败');
  } finally {
    $('refreshbtn').textContent = '刷新';
    $('refreshbtn').disabled = false;
  }
}

$('refreshbtn').onclick = () => refreshAll({ force: true });

// 备份 / 迁移
$('toggleimport').onclick = () => {
  const help = $('importhelp');
  const showing = help.style.display !== 'none';
  help.style.display = showing ? 'none' : 'block';
  $('exportbtn').classList.toggle('hide', showing);
  $('importbtn').classList.toggle('hide', showing);
};
$('exportbtn').onclick = exportBackup;
$('importbtn').onclick = () => $('importfile').click();
$('importfile').onchange = (e) => { handleImportFile(e.target.files?.[0]); e.target.value = ''; };

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) refreshAll();
});

$('total').oninput = renderAllocation;
$('feerate').oninput = renderAllocation;
$('total').onblur = () => saveTargets();
$('feerate').onblur = () => saveTargets();

$('preset-same').onclick = () => {
  const n = SYMBOLS.length;
  const base = Math.floor(100 / n);
  SYMBOLS.forEach((s, i) => {
    const v = i === 0 ? 100 - base * (n - 1) : base;
    const el = document.querySelector(`[data-pct="${s}"]`);
    if (el) el.value = String(v);
  });
  renderAllocation(); saveTargets({ quiet: true });
  toast(`已均分为整数：${SYMBOLS.map((s) => document.querySelector(`[data-pct="${s}"]`).value + '%').join(' / ')}`);
};
$('preset-last').onclick = () => {
  $('total').value = S.targets.totalAmount;
  $('feerate').value = (Number(S.rules.feeRate) * 100).toFixed(2).replace(/\.?0+$/, '');
  for (const s of SYMBOLS) {
    const el = document.querySelector(`[data-pct="${s}"]`);
    if (el) el.value = String(Math.round(Number(S.targets.allocation[s]) || 0));
  }
  renderAllocation(); saveTargets({ quiet: true });
};

$('buytargets').onclick = () => {
  const a = computeAllocation();
  if (!a.ok) { showErr('还不能买入：' + a.errors.join('；')); return; }
  const lines = a.lines.filter((l) => l.ok && l.shares > 0);
  if (!lines.length) { showErr('没有可买入的标的（占比都是 0？）'); return; }
  openSheet({ kind: 'all', lines, totalCharge: round2(lines.reduce((x, l) => x + l.totalCharge, 0)), feeRate: a.feeRate });
};
$('fillsum').onclick = fillRemainder;

$('resetbase').onclick = async () => {
  try {
    await api('/api/buy/reset-baseline', { method: 'POST', body: {} });
    toast('已把当日基准重置为最新昨收');
    await refreshAll({ force: true });
  } catch (e) { showErr('重置失败：' + e.message); }
};

$('savepos').onclick = savePositions;
$('clearpos').onclick = () => {
  for (const s of SYMBOLS) S.positions[s] = { ...(S.positions[s] || {}), shares: 0, avgCost: 0 };
  renderPositionLines();
  syncPositionTotals();
  toast('已填写为 0，点「保存持仓」生效');
};
$('editbtn').onclick = toggleEdit;

$('allocbody').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-buy]');
  if (!btn) return;
  const sym = btn.getAttribute('data-buy');
  const a = computeAllocation();
  const line = a.lines.find((l) => l.symbol === sym);
  if (!a.ok || !line || !line.ok || line.shares <= 0) {
    showErr(`还不能买入 ${sym}：` + (line?.error || a.errors.join('；') || '金额无效'));
    return;
  }
  openSheet({ kind: 'one', lines: [line], totalCharge: line.totalCharge, feeRate: a.feeRate });
});

refreshAll({ force: true });
refreshHealth();
setInterval(() => { if (!document.hidden) refreshQuotes(); }, 30_000);
</script>
</body>
